# SecureAI — the proxy: the ONLY enforcement point (AD-1).
#
# Runs in the TRUSTED zone on runc, never in the Kata VM. It is the only
# process that ever holds a real API key, so its runtime is pinned explicitly:
# if this service is ever drawn into the Kata VM, the trust boundary is gone
# and every other guarantee here is void (AD-6).
#
# Every ${...} comes from /etc/secureai/compose.env (AD-11) -- including the host
# paths, so `docker compose` behaves identically whether it is invoked by the
# CLI or by hand. No literal value of a cross-boundary constant appears here.

name: secureai

services:
  # ---------------------------------------------------------------- trusted
  proxy:
    runtime: runc            # EXPLICIT and load-bearing -- never remove (AD-6)
    # The image this project BUILDS, not the upstream tag: the addon is copied
    # in at build time, so pointing at upstream mitmproxy would leave mitmdump
    # pointing at an addon path that does not exist in the image.
    image: ${SECUREAI_PROXY_IMAGE}
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: secureai-proxy
    restart: "no"            # the proxy must die with the agent (AD-14, F12)
    command:
      - mitmdump
      - --listen-host=0.0.0.0
      - --listen-port=${SECUREAI_PROXY_PORT}
      # AD-12: the CA lives INSIDE the mounted path so that the certificate
      # `secureai ca export` publishes -- and bakes into the guest image -- is
      # the very certificate this proxy uses. A confdir outside the mount would
      # make mitmproxy mint a fresh CA on every start, and then no TLS
      # interception would ever validate against the guest's trust store.
      - --set=confdir=/config/ca
      - --set=flow_detail=0   # scrubbed at source; never log header values
      - --set=termlog_verbosity=warning
      - -s
      - /opt/secureai/addon.py
    environment:
      # The proxy reads policy from the read-only runtime copy; it never writes
      # config (AD-13). Its own CA dir is the single exception, and only because
      # mitmproxy must persist a generated keypair across restarts.
      SECUREAI_CONFIG_DIR: /config
      SECUREAI_PLACEHOLDER_KEY: ${SECUREAI_PLACEHOLDER_KEY}
    volumes:
      # :Z -- the proxy is the ONLY consumer of /config now that the guest
      # mount is removed (AD-7, AD-13). No other service may read keys.
      # Mode is ro,Z (comma form): read-only plus private label.
      - ${SECUREAI_VAR_DIR}:/config:ro,Z
      # The proxy owns its CA directory. :Z -- single consumer, same container.
      # Writable: mitmproxy must persist its keypair across restarts (AD-12).
      - ${SECUREAI_CA_DIR}:/config/ca:Z
    networks:
      secureai_net:
        # Fixed IP: the Kata guest reaches the proxy by literal address, never
        # by Compose service DNS, which does not exist inside the VM (AD-5).
        ipv4_address: ${SECUREAI_PROXY_IP}
    healthcheck:
      # Exercises the proxy AND its policy, not merely that the process is
      # alive: a plain process check would report healthy before mitmproxy can
      # serve (Story 2.6), and a raw-socket-only check would report healthy
      # before keys are loaded in-process. The socket proves the proxy answers
      # on its port; the addon check proves policy loads in-process
      # (whitelist readable, keys in-process) via the same code the proxy
      # serves with. Until both pass, health stays unhealthy so a first
      # request cannot race key loading.
      # The CLI's own poll loop in cmd_opencode is the ENFORCING gate when the
      # guest is started with --no-deps (which skips depends_on): it waits for
      # this health status before attaching. Keep service_healthy below as the
      # declarative backup -- removing the CLI wait because depends_on exists,
      # or removing depends_on because the CLI waits, reintroduces the race.
      test:
        - CMD
        - python3
        - -c
        - >-
          import socket,sys;
          s=socket.create_connection(("127.0.0.1", ${SECUREAI_PROXY_PORT}), 3);
          s.sendall(b"CONNECT 127.0.0.1:443 HTTP/1.1\r\nHost: 127.0.0.1\r\n\r\n");
          d=s.recv(64); s.close();
          sys.exit(1) if not d else None;
          sys.path.insert(0, "/opt/secureai");
          import addon;
          sys.exit(0 if addon.SecureAIAddon().is_healthy() else 1)
      interval: 2s
      timeout: 5s
      # Bounded so a proxy that never becomes healthy surfaces a readable
      # error instead of hanging the session forever.
      retries: 15
      start_period: 5s

  # -------------------------------------------------------------- untrusted
  opencode:
    runtime: kata            # the guest runs under its own kernel (AD-6, NFR3)
    image: ${SECUREAI_OPENCODE_IMAGE}
    build:
      context: .
      dockerfile: opencode/Dockerfile
    container_name: secureai-opencode
    restart: "no"
    # Land the user INSIDE the agent -- not `compose up`, not `docker exec`
    # (AD-14). The CLI supplies -it.
    stdin_open: true
    tty: true
    # The launch directory is the only host content the guest sees (concept
    # demo: host `ls` == guest `ls /workspace`, siblings invisible, `uname -r`
    # differs). The CLI exports SECUREAI_WORKSPACE from `pwd -P` and refuses
    # $HOME and / so keys are never exposed.
    working_dir: /workspace
    depends_on:
      proxy:
        # The agent must not start until the proxy can actually serve, so the
        # first request cannot race proxy boot (Story 2.6). This is the
        # DECLARATIVE backup: when the CLI starts the guest with --no-deps
        # (proxy already up under the same name), compose SKIPS this gate and
        # the CLI's own poll loop in cmd_opencode is the ENFORCING gate that
        # waits for the health status above. Keep both -- removing the CLI
        # wait because this exists, or this because the CLI waits,
        # reintroduces the race.
        condition: service_healthy
    environment:
      # Placeholder only. The real key is substituted by the proxy on the way
      # out and never travels back into the guest (AD-1, AD-10).
      ANTHROPIC_API_KEY: ${SECUREAI_PLACEHOLDER_KEY}
      OPENAI_API_KEY: ${SECUREAI_PLACEHOLDER_KEY}
      # No OPENCODE_API_KEY here on purpose: Zen free models are used
      # anonymously, and any placeholder Bearer would turn anonymous calls
      # into `Invalid credential` rejections upstream.
      HTTPS_PROXY: http://${SECUREAI_PROXY_IP}:${SECUREAI_PROXY_PORT}
      HTTP_PROXY: http://${SECUREAI_PROXY_IP}:${SECUREAI_PROXY_PORT}
      # Required: without it the TUI's loopback server call routes back
      # through the proxy and deadlocks (AD-5 corollary).
      NO_PROXY: localhost,127.0.0.1,::1
      # Vendored model catalog -- models.opencode.ai leaves the allowlist (AD-8).
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      XDG_CONFIG_HOME: /home/node/.config
      XDG_DATA_HOME: /home/node/.local/share
      XDG_CACHE_HOME: /home/node/.cache
      XDG_STATE_HOME: /home/node/.local/state
    volumes:
      # The launch directory, mounted as /workspace. Shared label (:z, not :Z)
      # because host and guest share it; :Z would relabel the user's project
      # private to the guest. No /config mount: the guest must never see keys
      # or the CA private key (AD-1, AD-12, NFR1).
      - ${SECUREAI_WORKSPACE}:/workspace:z
      - opencode-config:/home/node/.config/opencode
      - opencode-data:/home/node/.local/share/opencode
    networks:
      secureai_net:
        ipv4_address: ${SECUREAI_OPENCODE_IP}
    # AD-5: upstream resolution is guest-local and carries no enforcement
    # meaning. Docker's embedded resolver does NOT exist inside a Kata VM
    # (kata#6688), and the bridge gateway runs no DNS, so the guest
    # uses public resolvers directly. DNS is NOT mediated by the proxy.
    # SERVICE-level key -- inside the service, not under the network mapping.
    dns:
      - 1.1.1.1
      - 8.8.8.8

networks:
  secureai_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SECUREAI_SUBNET}
    # Enforcement is cooperative (AD-1): the guest routes via the proxy because
    # the runtime honors the proxy variables. No `internal: true` claim is made
    # here -- whether it reaches the Kata tap device is unproven and out of
    # scope for the concept demo.

volumes:
  opencode-config:
  opencode-data: